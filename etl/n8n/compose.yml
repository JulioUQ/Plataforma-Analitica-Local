services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.49.5
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Los nodos de ficheros solo pueden leer los dos montajes de solo lectura de abajo
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/ejemplos;/data/alquileres
      # El historial de ejecuciones guarda las filas leídas (incluidos datos de huéspedes):
      # se conserva en local y se purga a los 14 días
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./ejemplos:/data/ejemplos:ro
      # Excel reales de Airbnb y Booking (carpeta data/ del repo, ignorada por Git)
      - ../../data:/data/alquileres:ro

volumes:
  n8n_data:
