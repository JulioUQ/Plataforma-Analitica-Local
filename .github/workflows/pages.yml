# Genera el dashboard estático desde publicacion/agregados_alquileres.json (agregados mensuales
# exportados en local con python/exportar_agregados.py) y lo publica en GitHub Pages.
# Solo usa ese archivo del repositorio: sin Excel, credenciales ni acceso a SQL Server.
name: Publicar dashboard en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      - name: Instalar dependencias de la página
        run: python -m pip install -r requirements-pages.txt

      - name: Generar la página desde publicacion/agregados_alquileres.json
        run: python python/generar_pagina.py --origen publicacion/agregados_alquileres.json --salida _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
